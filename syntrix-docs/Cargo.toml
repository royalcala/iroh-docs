[package]
name = "iroh-syntrix-docs"
version = "0.1.0"
edition = "2021"
description = "Authorization wrapper for iroh-docs — namespace registry and accept callback for multi-org ERP"
license = "MIT/Apache-2.0"
repository = "https://github.com/royalcala/iroh-docs"

[dependencies]
iroh-docs = { path = ".." }
iroh = { version = "=1.0.0-rc.1", default-features = false }
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
